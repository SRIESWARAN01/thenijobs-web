name: thenijobs
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  cloud_functions: ^5.0.2
  firebase_storage: ^12.0.1
  firebase_analytics: ^11.2.0
  firebase_messaging: ^15.0.2
  google_sign_in: ^6.2.1
  dio: ^5.5.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  file_picker: ^8.0.7
  intl: ^0.19.0
  google_fonts: ^6.2.1
  speech_to_text: ^7.4.0
  # ===== Mobile redesign (premium native experience) =====
  cached_network_image: ^3.3.1   # cached logos/banners, lazy image loading
  shimmer: ^3.0.0                 # skeleton loaders
  flutter_secure_storage: ^9.2.2  # secure token / session storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
