name: thenijobs
description: THENIJOBS - Multi-sided marketplace platform for Tamil Nadu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.10.0
  firebase_storage: ^12.5.0
  firebase_database: ^11.4.0
  firebase_messaging: ^15.4.0
  firebase_analytics: ^11.6.0

  # Auth
  google_sign_in: ^6.2.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
  lucide_icons: ^0.257.0
  
  # Forms
  flutter_hooks: ^0.20.5
  
  # Payment
  razorpay_flutter: ^1.3.7

  # File & Media
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # Charts
  fl_chart: ^0.70.2

  # Local Storage
  shared_preferences: ^2.5.3
  hive_flutter: ^2.0.0

  # HTTP
  dio: ^5.7.0

  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1

  # PDF
  pdf: ^3.11.2
  printing: ^5.13.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
